<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kakekomi</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="app">
  <header class="app-header">
    <div class="app-header-row">
      <div>
        <h1>Kakekomi</h1>
        <p>お金のことを、一人で抱え込まなくていい場所</p>
      </div>
      <div class="header-actions">
        <div id="account-area" class="account-area"></div>
        <button id="export-note" type="button" class="new-session-btn">相談内容を書き出す</button>
        <button id="new-session" type="button" class="new-session-btn">新しい相談を始める</button>
      </div>
    </div>
    <div class="guest-banner">
      この相談内容はサーバーには一切保存されません。ページを離れたり「新しい相談を始める」を押すと消えます。
      残しておきたい場合は「相談内容を書き出す」でファイルに保存してください。
    </div>
  </header>

  <main class="layout">
    <section class="chat-panel">
      <div id="messages" class="messages" aria-live="polite"></div>
      <form id="composer" class="composer">
        <textarea id="input" placeholder="今の状況を、思うままに書いてみてください（Enterで送信、Shift+Enterで改行）" rows="3"></textarea>
        <button type="submit">送る</button>
      </form>
    </section>

    <aside class="note-panel">
      <h2>まとめノート</h2>
      <div id="notes" class="notes">
        <p class="notes-empty">会話が進むと、ここに整理された内容が付箋のように表示されます。</p>
      </div>
    </aside>
  </main>
</div>

<!-- ログイン・新規登録モーダル -->
<div id="auth-modal" class="modal-overlay" hidden>
  <div class="modal">
    <div class="modal-tabs">
      <button type="button" class="modal-tab" data-mode="register">新規登録</button>
      <button type="button" class="modal-tab" data-mode="login">ログイン</button>
    </div>
    <form id="auth-form">
      <label>
        メールアドレス（ログインIDとして使います）
        <input id="auth-login-id" type="text" inputmode="email" maxlength="254" required autocomplete="username" autocapitalize="none" spellcheck="false" />
      </label>
      <p class="modal-note" id="auth-email-note">このメールアドレスにメールが送られることはありません。</p>
      <label id="auth-display-name-field">
        表示名（チャット画面に表示される呼び名。他の人と重複してもかまいません）
        <input id="auth-display-name" type="text" maxlength="50" />
      </label>
      <label>パスワード（8文字以上、英字と数字の両方を含める）<input id="auth-password" type="password" maxlength="128" required autocomplete="current-password" /></label>
      <label id="auth-password-confirm-field">
        パスワード（確認のためもう一度）
        <input id="auth-password-confirm" type="password" maxlength="128" autocomplete="new-password" />
      </label>
      <label class="modal-check">
        <input id="auth-show-password" type="checkbox" />
        パスワードを表示する
      </label>
      <p class="modal-note">パスワードを忘れた場合、再設定する方法はありません。忘れないようにご注意ください。</p>
      <p id="auth-error" class="modal-error" hidden></p>
      <div class="modal-actions">
        <button type="button" class="modal-cancel" data-close>キャンセル</button>
        <button type="submit" class="modal-primary" id="auth-submit">登録する</button>
      </div>
    </form>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
